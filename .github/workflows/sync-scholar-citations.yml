name: Sync Google Scholar citations

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and update citation data
        run: python3 scripts/update_scholar_citations.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_citations.yml
          if git diff --staged --quiet; then
            echo "No citation changes."
          else
            git commit -m "chore: auto-sync Google Scholar citations"
            git push
          fi
